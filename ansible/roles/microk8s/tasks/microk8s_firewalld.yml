---
- name: Firewall Config Block
  become: true
  tags: firewall
  block:
    - name: Open permitted ports on firewalld zone 'internal'
      ansible.posix.firewalld:
        zone: internal
        port: "{{ item }}"
        state: enabled
        permanent: true
        immediate: true
      with_items: "{{ microk8s_permitted_ports }}"

    # Must be 'trusted', not 'internal'. A zone with target 'default' only
    # forwards within itself, which is enough for pods to reach the LAN but
    # still rejects everything bound for the internet.
    - name: Allow permitted networks on firewalld zone 'trusted'
      ansible.posix.firewalld:
        zone: trusted
        source: "{{ item }}"
        state: enabled
        permanent: true
        immediate: true
      with_items: "{{ microk8s_permitted_networks }}"
