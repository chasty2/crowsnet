---
- name: User Config Block
  become: true
  tags: users
  block:
    - name: Add user to microk8s group
      ansible.builtin.user:
        name: "{{ microk8s_user }}"
        groups: microk8s
        append: true

    - name: Configure access to .kube caching directory
      ansible.builtin.file:
        path: "/home/{{ microk8s_user }}/.kube"
        owner: "{{ microk8s_user }}"
        group: "{{ microk8s_user }}"
        mode: "0700"
        state: directory

    - name: Wait for microk8s to become ready
      ansible.builtin.command: microk8s status --wait-ready --timeout 300
      changed_when: false
      check_mode: false
