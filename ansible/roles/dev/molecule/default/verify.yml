---
- name: Verify
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Gather package facts
      ansible.builtin.package_facts:

    - name: Assert the expected apt packages are installed
      ansible.builtin.assert:
        that:
          - "'claude-code' in ansible_facts.packages"
          - "'git' in ansible_facts.packages"
          - "'kubectl' in ansible_facts.packages"
          - "'gh' in ansible_facts.packages"
        fail_msg: "an expected apt package (claude-code, git, kubectl, gh) is not installed"

    - name: Locate the claude binary on PATH
      ansible.builtin.command: which claude
      changed_when: false

    - name: Locate the kubectl binary on PATH
      ansible.builtin.command: which kubectl
      changed_when: false

    - name: Locate the gh binary on PATH
      ansible.builtin.command: which gh
      changed_when: false

    - name: Locate the uv binaries on PATH
      ansible.builtin.command: "which {{ item }}"
      changed_when: false
      loop:
        - uv
        - uvx

    - name: Run uv
      ansible.builtin.command: uv --version
      changed_when: false

    - name: Stat the secrets mountpoint
      ansible.builtin.stat:
        path: /mnt/secrets
      register: dev_secrets_stat

    - name: Assert /mnt/secrets is owned by chasty2 with mode 0770
      ansible.builtin.assert:
        that:
          - dev_secrets_stat.stat.isdir
          - dev_secrets_stat.stat.pw_name == "chasty2"
          - dev_secrets_stat.stat.gr_name == "chasty2"
          - dev_secrets_stat.stat.mode == "0770"
        fail_msg: "/mnt/secrets is not a chasty2-owned 0770 directory"

    - name: Assert /mnt/secrets is a mountpoint
      ansible.builtin.command: mountpoint -q /mnt/secrets
      changed_when: false
