---
- name: Verify
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Gather package facts
      ansible.builtin.package_facts:

    - name: Assert the expected apt packages are installed
      ansible.builtin.assert:
        that:
          - "item in ansible_facts.packages"
        fail_msg: "expected apt package {{ item }} is not installed"
      loop:
        - claude-code
        - git
        - kubectl
        - gh
        - docker-ce
        - docker-ce-cli
        - containerd.io
        - docker-buildx-plugin
        - docker-compose-plugin

    - name: Locate expected binaries on PATH
      ansible.builtin.command: "which {{ item }}"
      changed_when: false
      loop:
        - claude
        - kubectl
        - gh
        - uv
        - uvx
        - docker
        - pulumi

    - name: Run uv
      ansible.builtin.command: uv --version
      changed_when: false

    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Assert docker is running and enabled
      ansible.builtin.assert:
        that:
          - ansible_facts.services["docker.service"].state == "running"
          - ansible_facts.services["docker.service"].status == "enabled"
        fail_msg: "docker.service is not running and enabled"

    - name: Read the docker group
      ansible.builtin.getent:
        database: group
        key: docker

    - name: Assert chasty2 belongs to the docker group
      ansible.builtin.assert:
        that:
          - "'chasty2' in ansible_facts.getent_group['docker'][2].split(',')"
        fail_msg: "chasty2 is not a member of the docker group"

    - name: Run pulumi
      ansible.builtin.command: pulumi version
      environment:
        PULUMI_SKIP_UPDATE_CHECK: "true"
      changed_when: false

    - name: Stat the secrets mountpoint
      ansible.builtin.stat:
        path: /mnt/secrets
      register: dev_secrets_stat

    - name: Assert /mnt/secrets is owned by chasty2 with mode 0770
      ansible.builtin.assert:
        that:
          - dev_secrets_stat.stat.isdir
          - dev_secrets_stat.stat.pw_name == "chasty2"
          - dev_secrets_stat.stat.gr_name == "chasty2"
          - dev_secrets_stat.stat.mode == "0770"
        fail_msg: "/mnt/secrets is not a chasty2-owned 0770 directory"

    - name: Assert /mnt/secrets is a mountpoint
      ansible.builtin.command: mountpoint -q /mnt/secrets
      changed_when: false
