---
- name: Package Config Block
  become: true
  tags: packages
  block:
    - name: Create apt keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Add apt signing keys
      ansible.builtin.get_url:
        url: "{{ item.key_url }}"
        dest: "{{ item.keyring }}"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ dev_apt_repos }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Add apt repositories
      ansible.builtin.apt_repository:
        repo: "{{ item.repo }}"
        filename: "{{ item.name }}"
        state: present
      loop: "{{ dev_apt_repos }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Install dev packages
      ansible.builtin.apt:
        name: "{{ dev_packages }}"
        state: present
        update_cache: true

    - name: Download the uv installer
      ansible.builtin.get_url:
        url: "{{ dev_uv_installer_url }}"
        dest: "{{ dev_uv_installer_path }}"
        owner: root
        group: root
        mode: "0755"

    - name: Install uv
      ansible.builtin.command: "{{ dev_uv_installer_path }}"
      environment:
        UV_INSTALL_DIR: "{{ dev_uv_install_dir }}"
        UV_NO_MODIFY_PATH: "1"
      args:
        creates: "{{ dev_uv_install_dir }}/uv"

    - name: Download the Pulumi installer
      ansible.builtin.get_url:
        url: "{{ dev_pulumi_installer_url }}"
        dest: "{{ dev_pulumi_installer_path }}"
        owner: root
        group: root
        mode: "0755"

    - name: Install Pulumi
      ansible.builtin.command: >-
        {{ dev_pulumi_installer_path }}
        --install-root {{ dev_pulumi_install_root }}
        --no-edit-path
      args:
        creates: "{{ dev_pulumi_install_root }}/bin/pulumi"
