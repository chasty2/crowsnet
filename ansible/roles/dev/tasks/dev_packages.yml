---
- name: Package Config Block
  become: true
  tags: packages
  block:
    - name: Create apt keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Add Claude Code apt signing key
      ansible.builtin.get_url:
        url: "{{ dev_claude_key_url }}"
        dest: "{{ dev_claude_keyring }}"
        owner: root
        group: root
        mode: "0644"

    - name: Add Claude Code apt repository
      ansible.builtin.apt_repository:
        repo: "{{ dev_claude_repo }}"
        filename: claude-code
        state: present

    - name: Add Kubernetes apt signing key
      ansible.builtin.get_url:
        url: "{{ dev_kubectl_key_url }}"
        dest: "{{ dev_kubectl_keyring }}"
        owner: root
        group: root
        mode: "0644"

    - name: Add Kubernetes apt repository
      ansible.builtin.apt_repository:
        repo: "{{ dev_kubectl_repo }}"
        filename: kubernetes
        state: present

    - name: Install dev packages
      ansible.builtin.apt:
        name: "{{ dev_packages }}"
        state: present
        update_cache: true

    - name: Download the uv installer
      ansible.builtin.get_url:
        url: "{{ dev_uv_installer_url }}"
        dest: "{{ dev_uv_installer_path }}"
        owner: root
        group: root
        mode: "0755"

    - name: Install uv
      ansible.builtin.command: "{{ dev_uv_installer_path }}"
      environment:
        UV_INSTALL_DIR: "{{ dev_uv_install_dir }}"
        UV_NO_MODIFY_PATH: "1"
      args:
        creates: "{{ dev_uv_install_dir }}/uv"
