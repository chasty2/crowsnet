---
# Idempotent Claude Code install from Anthropic's signed apt repository
- name: Package Config Block
  become: true
  tags: packages
  block:
    - name: Create apt keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install dev packages
      ansible.builtin.apt:
        name: "{{ item }}"
        state: present
      with_items: "{{ dev_packages }}"

    - name: Add Claude Code apt signing key
      ansible.builtin.get_url:
        url: "{{ dev_claude_key_url }}"
        dest: "{{ dev_claude_keyring }}"
        owner: root
        group: root
        mode: "0644"

    - name: Add Claude Code apt repository
      ansible.builtin.apt_repository:
        repo: "{{ dev_claude_repo }}"
        filename: claude-code
        state: present

    - name: Install Claude Code
      ansible.builtin.apt:
        name: claude-code
        state: present
        update_cache: true

    - name: Add Kubernetes apt signing key
      ansible.builtin.get_url:
        url: "{{ dev_kubectl_key_url }}"
        dest: "{{ dev_kubectl_keyring }}"
        owner: root
        group: root
        mode: "0644"

    - name: Add Kubernetes apt repository
      ansible.builtin.apt_repository:
        repo: "{{ dev_kubectl_repo }}"
        filename: kubernetes
        state: present

    - name: Install kubectl
      ansible.builtin.apt:
        name: kubectl
        state: present
        update_cache: true
