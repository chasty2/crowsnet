---
# Minimal smoke checks for the common role. Idempotency is verified separately
# by molecule's built-in `idempotence` step, not here.
- name: Verify
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Assert sshd is running
      ansible.builtin.assert:
        that:
          - "'ssh.service' in ansible_facts.services or 'sshd.service' in ansible_facts.services"
        fail_msg: "sshd service is not present"

    - name: Assert the chasty2 admin user exists
      ansible.builtin.getent:
        database: passwd
        key: chasty2

    - name: Validate the chasty2 sudoers drop-in
      ansible.builtin.command: /usr/sbin/visudo -csf /etc/sudoers.d/chasty2
      changed_when: false

    - name: Read the chasty2 sudoers drop-in
      ansible.builtin.slurp:
        src: /etc/sudoers.d/chasty2
      register: common_chasty2_sudoers

    - name: Assert the sudoers drop-in ends with a newline
      ansible.builtin.assert:
        that:
          - (common_chasty2_sudoers.content | b64decode).endswith('\n')
        fail_msg: "sudoers drop-in has no trailing newline; sudo 1.9.13+ rejects it"

    - name: Read chasty2 .bashrc
      ansible.builtin.slurp:
        src: /home/chasty2/.bashrc
      register: common_chasty2_bashrc

    - name: Assert fzf bash integration is configured
      ansible.builtin.assert:
        that:
          - "'fzf --bash' in (common_chasty2_bashrc.content | b64decode)"
        fail_msg: "fzf bash integration missing from chasty2 .bashrc"
