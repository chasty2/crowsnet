- name: Update and Reboot VM's
  hosts: virtual
  become: true
  tasks:
    - name: Update repository caches
      ansible.builtin.apt:
        update_cache: true

    - name: Update all packages # noqa package-latest
      ansible.builtin.package:
        name: '*'
        state: latest

    - name: Remove unused dependencies
      ansible.builtin.apt:
        autoremove: true

    - name: Clear apt caches
      ansible.builtin.apt:
        autoclean: true

    - name: Stop microk8s before reboot
      ansible.builtin.command: microk8s stop
      changed_when: true
      when: inventory_hostname == microk8s_node

    - name: Reboot
      ansible.builtin.reboot:

    - name: Restore microk8s after reboot
      when: inventory_hostname == microk8s_node
      block:
        - name: Start microk8s
          ansible.builtin.command: microk8s start
          changed_when: true

        - name: Wait for microk8s to become ready
          ansible.builtin.command: microk8s status --wait-ready --timeout 300
          changed_when: false
